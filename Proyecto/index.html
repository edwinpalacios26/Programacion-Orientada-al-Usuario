<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Capital - Iniciar Sesión</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        
        <h1 class="brand-title">FUN CAPITAL</h1>

        
        <h2 class="login-title">Iniciar sesión</h2>
        <p class="login-subtitle">Enviaremos un código a tu teléfono para ingresar.</p>

       
        <div class="input-group">
            <label for="phone">Teléfono *</label>
            <input type="text" id="phone" class="input-field" placeholder="+503 7000-0000">
        </div>

       
        <p class="method-label">Ingresar usando</p>
        <button type="button" class="btn btn-whatsapp">Mensaje de Whatsapp</button>
        <button type="button" class="btn btn-sms">Mensaje de texto</button>

      
        <a href="#" class="help-link">¿No te llega el código? Escríbenos por WhatsApp</a>
    </main>

</body>
</html>
