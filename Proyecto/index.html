<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Capital - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">

    <div class="login-container">
        <h1 class="brand-title">FUN CAPITAL</h1>
        <h2 class="login-title">Iniciar sesión</h2>
        <p class="login-subtitle">Enviaremos un código a tu teléfono para ingresar.</p>

        
        <form onsubmit="event.preventDefault(); window.location.href='eventos.html'">
            <div class="input-group">
                <label for="phone">Teléfono *</label>
                <input type="tel" id="phone" class="input-field" placeholder="Ej. 77777777" required>
            </div>

            <p class="method-label">Ingresar usando</p>
            
           
            <button type="submit" class="btn btn-whatsapp">Mensaje de WhatsApp</button>
            <button type="submit" class="btn btn-sms">Mensaje de texto</button>
        </form>

        <a href="#" class="help-link">¿No te llega el código? Escríbenos por WhatsApp</a>
    </div>

</body>
</html>
